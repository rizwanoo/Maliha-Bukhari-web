    <!-- Script for Dynamic Absolute URL Resolution (Ensures WhatsApp & Social crawlers get full absolute URLs) -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location && window.location.origin) {
          const origin = window.location.origin;
          
          // Helper to resolve relative path to absolute URL
          function makeAbsolute(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            return origin + (path.startsWith('/') ? path : '/' + path);
          }

          // Dynamic OG Image Resolution
          const ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', makeAbsolute(ogImg.getAttribute('content')));

          const ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec) ogImgSec.setAttribute('content', makeAbsolute(ogImgSec.getAttribute('content')));

          const twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', makeAbsolute(twImg.getAttribute('content')));

          const ogUrl = document.querySelector('meta[property="og:url"]');
          if (!ogUrl) {
            const metaUrl = document.createElement('meta');
            metaUrl.setAttribute('property', 'og:url');
            metaUrl.setAttribute('content', window.location.href);
            document.head.appendChild(metaUrl);
          }

          const canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', window.location.href);
        }
      })();
    </script>
